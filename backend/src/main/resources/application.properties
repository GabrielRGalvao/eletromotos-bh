spring.application.name=backend

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Vídeos de vistoria
app.videos.diretorio=${APP_VIDEOS_DIRETORIO:./uploads/vistorias}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

app.admin.nome=${APP_ADMIN_NOME:}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.senha=${APP_ADMIN_SENHA:}

server.servlet.session.timeout=12h